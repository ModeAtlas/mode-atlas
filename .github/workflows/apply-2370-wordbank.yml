name: Apply Mode Atlas 2.37.0 Word Bank professionalisation

on:
  push:
    branches:
      - agent/mode-atlas-2.37.0-wordbank-professionalisation
    paths:
      - .github/trigger-2370.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate transformer syntax
        run: python3 -m py_compile .github/apply_2370.py .github/fix_2370_audit.py .github/fix_2370_tests.py
      - name: Apply source changes
        run: |
          python3 .github/apply_2370.py
          python3 .github/fix_2370_audit.py
          python3 .github/fix_2370_tests.py
      - name: Rebuild revisioned assets
        run: python3 build_revision_assets.py
      - name: Audit and tests
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
      - name: Release guards
        run: |
          grep -q "var VERSION = '2.37.0';" assets/app/mode-atlas-version.js
          grep -q "var CACHE_REVISION = 'assets-2.37.0';" assets/app/mode-atlas-version.js
          grep -q 'class="wordbank-intro ma-page-hero"' wordbank/index.html
          grep -q 'class="wordbank-library ma-page-section"' wordbank/index.html
          ! grep -q 'library-panel ma-card' wordbank/index.html
          grep -q 'createEl("details", "wordbank-entry")' assets/pages/mode-atlas-wordbank-page.js
          grep -q 'Clear search & filters' assets/pages/mode-atlas-wordbank-page.js
          grep -q 'wordbank-library ma-page-section' audit_project.py
          python3 - <<'PY'
          from pathlib import Path
          html=Path('wordbank/index.html').read_text()
          assert html.count('<section') == html.count('</section>'), (html.count('<section'), html.count('</section>'))
          PY
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/apply_2370.py .github/fix_2370_audit.py .github/fix_2370_tests.py .github/workflows/apply-2370-wordbank.yml .github/trigger-2370.txt
          rm -rf __pycache__ .github/__pycache__
          git add -A
          git commit -m "Release Mode Atlas 2.37.0 Word Bank professionalisation"
          git push origin HEAD
