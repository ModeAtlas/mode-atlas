name: Apply Mode Atlas 2.33.0 experience restructure
on:
  push:
    branches: [agent/mode-atlas-2.33.0-app-experience-restructure]
permissions:
  contents: write
jobs:
  restructure:
    if: github.event.head_commit.message == 'Apply 2.33.0 app experience restructure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source restructure
        run: python3 .github/apply_2330.py
      - name: Rebuild revisioned assets
        run: python3 build_revision_assets.py
      - name: Audit and regression tests
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
      - name: Release hygiene
        run: |
          grep -q "var VERSION = '2.33.0';" assets/app/mode-atlas-version.js
          grep -q "var CACHE_REVISION = 'assets-2.33.0';" assets/app/mode-atlas-version.js
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/apply_2330.py .github/workflows/apply-2330-experience-restructure.yml .github/trigger-2330.txt
          rm -rf __pycache__
          git add -A
          git commit -m "Release Mode Atlas 2.33.0 app experience restructure"
          git push origin HEAD
