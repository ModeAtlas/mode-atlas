name: Fix Mode Atlas 2.31.3 audit contract v2
on:
  push:
    branches:
      - agent/mode-atlas-2.31.3-ui-simplification
permissions:
  contents: write
jobs:
  fix-audit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace superseded Word Bank audit block
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('audit_project.py')
          t = p.read_text()
          pattern = re.compile(r"    wordbank_markup = text\(ROOT / 'wordbank/index\.html'\)\n.*?        fail\(errors, 'Word Bank library-first hierarchy or secondary tools disclosure drifted'\)", re.S)
          replacement = '''    wordbank_markup = text(ROOT / 'wordbank/index.html')
    library_pos = wordbank_markup.find('class="panel library-panel ma-card"')
    add_pos = wordbank_markup.find('id="wordBankAddPanel"')
    if (
        library_pos < 0 or add_pos <= library_pos
        or 'id="wordBankAddJumpBtn"' not in wordbank_markup
        or 'id="wordBankActionsBtn"' not in wordbank_markup
        or 'id="wordBankActionsPanel"' not in wordbank_markup
        or '<details class="wordbank-tools">' in wordbank_markup
        or 'id="exportBtn"' in wordbank_markup
        or 'id="importFile"' in wordbank_markup
    ):
        fail(errors, 'Word Bank library-first hierarchy or collection settings ownership drifted')'''
          new, count = pattern.subn(replacement, t, count=1)
          if count != 1:
              raise SystemExit(f'Expected one Word Bank audit block, replaced {count}')
          p.write_text(new)
          PY
          rm -f .github/workflows/fix-2313-audit-contract.yml .github/workflows/fix-2313-audit-contract-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Word Bank audit contract for 2.31.3"
          git push origin HEAD
