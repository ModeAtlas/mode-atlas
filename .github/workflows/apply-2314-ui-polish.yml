name: Apply Mode Atlas 2.31.4 UI polish
on:
  push:
    branches:
      - agent/mode-atlas-2.31.4-ui-polish
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source block missing in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Profile: one state-aware authentication control.
          replace_once(
              'assets/ui/mode-atlas-profile-menu.js',
              '''            <div class="ma-auth-actions">\n              <button class="ma-button ma-button--primary" id="profileSignInBtn" data-profile-sign-in type="button">Sign in with Google</button>\n              <button class="ma-button" id="profileSignOutBtn" data-profile-sign-out type="button" hidden>Sign out</button>\n            </div>''',
              '''            <div class="ma-auth-actions">\n              <button class="ma-button ma-button--primary ma-button--wide" id="profileAuthBtn" data-profile-auth type="button">\n                <span data-profile-auth-label>Sign in with Google</span>\n              </button>\n            </div>'''
          )

          # Cloud sync: add first-class support for a single auth button without changing
          # existing sign-in/sign-out button support elsewhere in the app.
          replace_once(
              'cloud-sync.js',
              '''const boundSignInButtons = new WeakSet();\nconst boundSignOutButtons = new WeakSet();''',
              '''const boundSignInButtons = new WeakSet();\nconst boundSignOutButtons = new WeakSet();\nconst boundAuthButtons = new WeakSet();'''
          )
          replace_once(
              'cloud-sync.js',
              '''  if (binding.signInBtn) setCloudElementVisible(binding.signInBtn, !user);\n  if (binding.signOutBtn) setCloudElementVisible(binding.signOutBtn, !!user);''',
              '''  if (binding.signInBtn) setCloudElementVisible(binding.signInBtn, !user);\n  if (binding.signOutBtn) setCloudElementVisible(binding.signOutBtn, !!user);\n  if (binding.authBtn) {\n    const label = binding.authBtn.querySelector('[data-profile-auth-label]');\n    const text = user ? 'Sign out' : 'Sign in with Google';\n    if (label) label.textContent = text;\n    else binding.authBtn.textContent = text;\n    binding.authBtn.classList.toggle('ma-button--primary', !user);\n    binding.authBtn.setAttribute('aria-label', text);\n  }'''
          )
          replace_once(
              'cloud-sync.js',
              '''  const signInBtn = options.signInBtn || null;\n  const signOutBtn = options.signOutBtn || null;\n  const statusEl = options.statusEl || null;''',
              '''  const signInBtn = options.signInBtn || null;\n  const signOutBtn = options.signOutBtn || null;\n  const authBtn = options.authBtn || null;\n  const statusEl = options.statusEl || null;'''
          )
          replace_once(
              'cloud-sync.js',
              '''    if (binding.signInBtn === signInBtn\n      && binding.signOutBtn === signOutBtn\n      && binding.statusEl === statusEl''',
              '''    if (binding.signInBtn === signInBtn\n      && binding.signOutBtn === signOutBtn\n      && binding.authBtn === authBtn\n      && binding.statusEl === statusEl'''
          )
          replace_once(
              'cloud-sync.js',
              '''    signInBtn: options.signInBtn || null,\n    signOutBtn: options.signOutBtn || null,\n    statusEl: options.statusEl || null,''',
              '''    signInBtn: options.signInBtn || null,\n    signOutBtn: options.signOutBtn || null,\n    authBtn: options.authBtn || null,\n    statusEl: options.statusEl || null,'''
          )
          replace_once(
              'cloud-sync.js',
              '''  if (binding.signOutBtn && !boundSignOutButtons.has(binding.signOutBtn)) {\n    boundSignOutButtons.add(binding.signOutBtn);\n    binding.signOutBtn.addEventListener('click', signOutUser);\n  }\n  uiBindings.add(binding);''',
              '''  if (binding.signOutBtn && !boundSignOutButtons.has(binding.signOutBtn)) {\n    boundSignOutButtons.add(binding.signOutBtn);\n    binding.signOutBtn.addEventListener('click', signOutUser);\n  }\n  if (binding.authBtn && !boundAuthButtons.has(binding.authBtn)) {\n    boundAuthButtons.add(binding.authBtn);\n    binding.authBtn.addEventListener('click', () => {\n      if (currentUser) void signOutUser();\n      else void signInWithGoogle();\n    });\n  }\n  uiBindings.add(binding);'''
          )

          replace_once(
              'assets/ui/mode-atlas-profile-drawer-bindings.js',
              '''        signInBtn: document.getElementById('profileSignInBtn'),\n        signOutBtn: document.getElementById('profileSignOutBtn'),\n        statusEl: null,''',
              '''        authBtn: document.getElementById('profileAuthBtn'),\n        statusEl: null,'''
          )

          # Settings: give preference labels a protected column, let segmented controls
          # shrink to drawer width, and collapse empty save-status space.
          replace_once(
              'assets/css/mode-atlas-profile-settings.css',
              '''.ma-settings-segmented{min-width:260px;}\n.ma-settings-segmented--display{min-width:320px;}\n.ma-settings-inline-actions{margin-top:2px;}\n.ma-settings-status{margin-top:10px;min-height:0;}''',
              '''.ma-settings-segmented{min-width:0;width:100%;}\n.ma-settings-segmented--display{min-width:0;width:100%;}\n.ma-shared-settings-drawer .ma-settings-section .ma-setting-row{grid-template-columns:minmax(96px,120px) minmax(0,1fr);gap:var(--ma-space-3);}\n.ma-shared-settings-drawer .ma-settings-section .ma-setting-row__control{justify-self:stretch;width:100%;}\n.ma-settings-inline-actions{margin-top:2px;}\n.ma-save-section{gap:var(--ma-space-3);}\n.ma-settings-status{margin-top:8px;min-height:0;}\n.ma-settings-status:empty{display:none;}\n.ma-save-section .ma-settings-status:not(:empty){margin-top:0;}'''
          )

          # Version metadata.
          replace_once('assets/app/mode-atlas-version.js', "var VERSION = '2.31.3';", "var VERSION = '2.31.4';")
          replace_once('assets/app/mode-atlas-version.js', "var CACHE_REVISION = 'assets-2.31.3';", "var CACHE_REVISION = 'assets-2.31.4';")
          replace_once('package.json', '"version": "2.31.3"', '"version": "2.31.4"')
          replace_once('README.md', 'Version: 2.31.3', 'Version: 2.31.4')

          changelog = Path('CHANGELOG.md')
          ch = changelog.read_text()
          heading = '## 2.31.4 - 2026-08-15'
          if heading not in ch:
              changelog.write_text('''## 2.31.4 - 2026-08-15\n- Fixed Settings preference-row overlap by giving labels a protected column and allowing segmented controls to size to the drawer.\n- Removed empty Save Data status spacing so the backup controls no longer leave a large unused gap.\n- Replaced separate profile Sign in / Sign out buttons with one state-aware Google account action that signs in when logged out and signs out when logged in.\n- Extended the shared cloud UI binding with a single auth-button contract while preserving existing two-button bindings elsewhere.\n\n''' + ch)

          tests = Path('tests/frontend.test.js')
          tt = tests.read_text()
          title = '2.31.4 profile and settings polish keeps auth and drawer layout state-owned'
          if title not in tt:
              tt += '''\n\ntest('2.31.4 profile and settings polish keeps auth and drawer layout state-owned', () => {\n  const profile = read('assets/ui/mode-atlas-profile-menu.js');\n  const bindings = read('assets/ui/mode-atlas-profile-drawer-bindings.js');\n  const cloud = read('cloud-sync.js');\n  const css = read('assets/css/mode-atlas-profile-settings.css');\n  assert.match(profile, /id="profileAuthBtn"/);\n  assert.doesNotMatch(profile, /profileSignInBtn|profileSignOutBtn/);\n  assert.match(bindings, /authBtn: document\.getElementById\('profileAuthBtn'\)/);\n  assert.match(cloud, /boundAuthButtons/);\n  assert.match(cloud, /currentUser\) void signOutUser\(\)/);\n  assert.match(css, /grid-template-columns:minmax\(96px,120px\) minmax\(0,1fr\)/);\n  assert.match(css, /\.ma-settings-status:empty\{display:none;\}/);\n});\n'''
          tests.write_text(tt)
          PY
          python3 build_revision_assets.py
          rm -f .github/workflows/apply-2314-ui-polish.yml
      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
          test ! -e .github/workflows/apply-2314-ui-polish.yml
          grep -q "VERSION = '2.31.4'" assets/app/mode-atlas-version.js
          grep -q 'assets-2.31.4' index.html
          grep -q 'id="profileAuthBtn"' assets/ui/mode-atlas-profile-menu.js
          ! grep -q 'profileSignInBtn' assets/ui/mode-atlas-profile-menu.js
      - name: Commit validated polish
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mode Atlas 2.31.4 profile and settings polish"
          git push origin HEAD
