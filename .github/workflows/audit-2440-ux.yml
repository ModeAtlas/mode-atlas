name: Audit Mode Atlas 2.44 UX Consistency
on:
  push:
    branches:
      - agent/mode-atlas-2.44.0-app-wide-ux-consistency
jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: User-facing consistency inventory
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('.')
          files=[]
          for p in root.rglob('*'):
              if not p.is_file(): continue
              s=str(p)
              if '/.git/' in s or s.startswith('.github/') or s.startswith('tests/') or '.assets-' in p.name: continue
              if p.suffix.lower() not in {'.html','.js','.py'}: continue
              files.append(p)
          terms=re.compile(r'\b(start|begin|continue|resume|end|review|practice|practise|study|open|close|back|save|cancel|clear|delete|install|check)\b',re.I)
          print('=== ACTION / TERMINOLOGY LITERALS ===')
          for p in sorted(files):
              text=p.read_text(errors='ignore')
              for i,line in enumerate(text.splitlines(),1):
                  if terms.search(line) and ('button' in line.lower() or '<a ' in line.lower() or 'textContent' in line or "'" in line or '"' in line):
                      compact=' '.join(line.strip().split())
                      if len(compact)>240: compact=compact[:237]+'...'
                      print(f'{p}:{i}: {compact}')
          print('\n=== HTML H1/H2 HEADINGS ===')
          tag_re=re.compile(r'<(h1|h2)(?:\s[^>]*)?>(.*?)</\1>',re.I|re.S)
          for p in sorted(root.rglob('*.html')):
              if '.assets-' in p.name: continue
              text=p.read_text(errors='ignore')
              items=[]
              for tag,body in tag_re.findall(text):
                  clean=re.sub(r'<[^>]+>',' ',body)
                  clean=' '.join(clean.split())
                  items.append(f'{tag.lower()}: {clean}')
              if items:
                  print(f'{p}: ' + ' | '.join(items))
          print('\n=== EMPTY / LOADING / ERROR COPY ===')
          state_re=re.compile(r'(no [a-z]|nothing|loading|preparing|finding|ready when|failed|error|try again|not available|unavailable)',re.I)
          for p in sorted(files):
              text=p.read_text(errors='ignore')
              for i,line in enumerate(text.splitlines(),1):
                  if state_re.search(line):
                      compact=' '.join(line.strip().split())
                      if len(compact)>220: compact=compact[:217]+'...'
                      print(f'{p}:{i}: {compact}')
          PY
