name: Apply responsive recomposition

on:
  push:
    branches:
      - agent/mode-atlas-2.47.0-responsive-recomposition

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Install responsive recomposition transfer'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply validated source diff
        shell: bash
        run: |
          base64 --decode .tmp/responsive-recomposition.patch.gz.b64 | gzip -dc > "${RUNNER_TEMP}/responsive.patch"
          git apply --check "${RUNNER_TEMP}/responsive.patch"
          git apply "${RUNNER_TEMP}/responsive.patch"
          python3 build_revision_assets.py
          python3 audit_project.py
          node --check tests/smoke.spec.js
          node --test tests/backend.test.js tests/frontend.test.js

      - name: Commit responsive sources
        shell: bash
        run: |
          rm -f .tmp/responsive-recomposition.patch.gz.b64
          rmdir .tmp 2>/dev/null || true
          rm -f .github/workflows/apply-responsive-recomposition.yml
          git config user.name "Mode Atlas Release Bot"
          git config user.email "48079170+ModeAtlas@users.noreply.github.com"
          git add -A
          git commit -m "Recompose phone and tablet layouts"
          git push origin HEAD:${GITHUB_REF_NAME}
