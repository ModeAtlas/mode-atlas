name: Audit Mode Atlas 2.31.4 pause point
on:
  push:
    branches:
      - agent/audit-2.31.4-pausepoint
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Full ownership and duplication scan
        shell: bash
        run: |
          set -euo pipefail
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib, collections
          root=Path('.')
          version='2.31.4'; rev='assets-2.31.4'
          print('\n=== TEMP OWNERSHIP SCAN ===')
          # Generated/canonical parity and stale revisions.
          canon=[]
          for p in root.rglob('*'):
              if not p.is_file() or p.suffix not in {'.js','.css'}: continue
              s=str(p)
              if '/node_modules/' in s or '/.git/' in s or re.search(r'\.assets-[0-9.]+\.(js|css)$', p.name): continue
              canon.append(p)
          mismatches=[]; missing=[]
          for p in canon:
              gen=p.with_name(p.stem+'.'+rev+p.suffix)
              if gen.exists():
                  if p.read_bytes()!=gen.read_bytes(): mismatches.append((str(p),str(gen)))
              elif p.name not in {'mode-atlas-version.js'} and not str(p).startswith('tests/'):
                  # Not every JS/CSS is revisioned; report only, don't fail.
                  pass
          stale=[str(p) for p in root.rglob('*') if p.is_file() and re.search(r'\.assets-(?!2\.31\.4)[0-9.]+\.(?:js|css)$',p.name)]
          print('canonical files scanned:',len(canon))
          print('generated mismatches:',len(mismatches))
          print('stale revisioned files:',len(stale))
          if mismatches: print('MISMATCHES',mismatches[:20])
          if stale: print('STALE',stale[:30])

          # Removed UI ownership/remnants.
          textfiles=[p for p in root.rglob('*') if p.is_file() and p.suffix in {'.js','.css','.html','.py'} and '.assets-' not in p.name and '.github/workflows/audit-2314-pausepoint.yml' not in str(p)]
          corpus={str(p):p.read_text(errors='ignore') for p in textfiles}
          probes={
            'old profile button ids':r'profileSignInBtn|profileSignOutBtn',
            'old profile data attrs':r'data-profile-sign-in|data-profile-sign-out',
            'wordbank page export/import handlers':r'\bexportBank\b|\bimportBank\b|wordbank-tools|wordBankExport|wordBankImport',
            'old quick capture rail':r'quick-capture|Quick Capture',
            'temporary helper workflow refs':r'apply-231[0-9]|audit-2314-pausepoint',
          }
          for label,pat in probes.items():
              hits=[]
              rg=re.compile(pat,re.I)
              for f,t in corpus.items():
                  if rg.search(t): hits.append(f)
              print(label+':',hits)

          # Exact function declaration names across canonical JS files.
          fnmap=collections.defaultdict(list)
          jsfiles=[p for p in canon if p.suffix=='.js']
          for p in jsfiles:
              t=p.read_text(errors='ignore')
              for m in re.finditer(r'(?m)^\s*(?:async\s+)?function\s+([A-Za-z_$][\w$]*)\s*\(',t): fnmap[m.group(1)].append(str(p))
          dupf={k:v for k,v in fnmap.items() if len(set(v))>1}
          print('duplicate declared function names across canonical JS:',len(dupf))
          for k,v in sorted(dupf.items(), key=lambda kv:(-len(set(kv[1])),kv[0]))[:60]: print(' FN',k,sorted(set(v)))

          # Repeated helper blocks: exact normalized 6-line windows across different JS files.
          winmap=collections.defaultdict(set)
          for p in jsfiles:
              lines=[re.sub(r'\s+',' ',x.strip()) for x in p.read_text(errors='ignore').splitlines()]
              for i in range(max(0,len(lines)-5)):
                  w='\n'.join(lines[i:i+6])
                  if len(w)<120 or not all(lines[i:i+6]): continue
                  winmap[hashlib.sha1(w.encode()).hexdigest()].add(str(p))
          cross=[v for v in winmap.values() if len(v)>1]
          paircounts=collections.Counter()
          for files in cross:
              fs=sorted(files)
              for i in range(len(fs)):
                  for j in range(i+1,len(fs)): paircounts[(fs[i],fs[j])]+=1
          print('top exact 6-line JS duplication pairs:')
          for (a,b),n in paircounts.most_common(20): print(' JSBLOCK',n,a,'<->',b)

          # CSS selector ownership across canonical CSS (naive but useful).
          selmap=collections.defaultdict(set)
          cssfiles=[p for p in canon if p.suffix=='.css']
          for p in cssfiles:
              t=re.sub(r'/\*.*?\*/','',p.read_text(errors='ignore'),flags=re.S)
              for m in re.finditer(r'([^{}@][^{}]*)\{',t):
                  raw=m.group(1).strip()
                  if not raw or raw.startswith(('from','to','0%','100%')): continue
                  for s in raw.split(','):
                      s=re.sub(r'\s+',' ',s.strip())
                      if s and len(s)<220: selmap[s].add(str(p))
          overlaps={s:fs for s,fs in selmap.items() if len(fs)>1}
          print('CSS selectors with multiple canonical owners:',len(overlaps))
          for s,fs in sorted(overlaps.items(), key=lambda kv:(-len(kv[1]),kv[0]))[:80]: print(' CSS',s,sorted(fs))

          # Specific current-owner checks.
          profile=corpus.get('assets/ui/mode-atlas-profile-menu.js','')
          bind=corpus.get('assets/ui/mode-atlas-profile-drawer-bindings.js','')
          cloud=corpus.get('cloud-sync.js','')
          settingscss=corpus.get('assets/css/mode-atlas-profile-settings.css','')
          compcss=corpus.get('assets/css/mode-atlas-components.css','')
          print('profileAuthBtn count in profile markup:',profile.count('profileAuthBtn'))
          print('profile binding uses authBtn:',"authBtn: document.getElementById('profileAuthBtn')" in bind)
          print('cloud authBtn contract count:',cloud.count('authBtn'))
          print('settings page-specific row override:', '.ma-shared-settings-drawer .ma-settings-section .ma-setting-row' in settingscss)
          print('shared forced-mode row stacking:', 'body[data-effective-display-mode="tablet"] .ma-setting-row' in compcss)

          # Hard failures only for actual release hygiene/removed ownership.
          assert not mismatches, 'canonical/generated asset mismatch'
          assert not stale, 'stale revisioned assets remain'
          assert 'profileSignInBtn' not in profile and 'profileSignOutBtn' not in profile
          wb=corpus.get('assets/pages/mode-atlas-wordbank-page.js','')+corpus.get('wordbank/index.html','')
          assert not re.search(r'\bexportBank\b|\bimportBank\b|wordbank-tools',wb,re.I), 'Word Bank duplicate backup ownership remains'
          print('=== END TEMP OWNERSHIP SCAN ===')
          PY
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/audit-2314-pausepoint.yml
          git commit -m "Remove temporary pause-point audit workflow"
          git push origin HEAD
