name: Apply Mode Atlas 2.44.0 UX Consistency
on:
  push:
    branches:
      - agent/mode-atlas-2.44.0-app-wide-ux-consistency
    paths:
      - .github/apply_2440.py
      - .github/fix_2440_audit.py
      - .github/workflows/apply-2440-ux-consistency.yml
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate transformers
        run: |
          python3 -m py_compile .github/apply_2440.py
          python3 -m py_compile .github/fix_2440_audit.py
      - name: Apply source changes
        run: |
          python3 .github/apply_2440.py
          python3 .github/fix_2440_audit.py
      - name: Validate changed JavaScript syntax
        run: |
          node --check assets/pages/mode-atlas-kana-page.js
          node --check assets/pages/mode-atlas-test-page.js
          node --check assets/pages/mode-atlas-wordbank-page.js
          node --check assets/results/mode-atlas-results-ui.js
          node --check assets/ui/mode-atlas-settings-menu.js
          node --check assets/app/mode-atlas-import-export.js
          node --check tests/frontend.test.js
      - name: Rebuild revisioned assets
        run: python3 build_revision_assets.py
      - name: Audit and tests
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
      - name: Release guards
        run: |
          grep -q "var VERSION = '2.44.0';" assets/app/mode-atlas-version.js
          grep -q "var CACHE_REVISION = 'assets-2.44.0';" assets/app/mode-atlas-version.js
          grep -q "('results', 'Test Results', '/results/')," frontend_components.py
          grep -q "View Test Results" frontend_components.py
          grep -q "No assessment selected" results/index.html
          grep -q "Back to Kana Trainer" results/index.html
          grep -q "Reading Test Average" assets/results/mode-atlas-results-ui.js
          grep -q "data-display=\"tablet\" type=\"button\">Tablet" assets/ui/mode-atlas-settings-menu.js
          grep -q "settings_hierarchy_markers" audit_project.py
          ! grep -q "View full Results" frontend_components.py
          ! grep -q ">Try Again<" frontend_components.py
          ! grep -q ">iPad</button>" assets/ui/mode-atlas-settings-menu.js
          git diff --check
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/apply_2440.py .github/fix_2440_audit.py .github/workflows/apply-2440-ux-consistency.yml .github/workflows/audit-2440-ux.yml
          rm -rf __pycache__ .github/__pycache__
          git add -A
          git commit -m "Release Mode Atlas 2.44.0 app-wide UX consistency"
          git push origin HEAD
