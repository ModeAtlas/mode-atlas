name: Apply Mode Atlas 2.38.0 trainer session experience

on:
  push:
    branches:
      - agent/mode-atlas-2.38.0-trainer-session-experience
    paths:
      - .github/trigger-2380.txt

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate transformer syntax
        run: python3 -m py_compile .github/apply_2380.py
      - name: Apply source changes
        run: python3 .github/apply_2380.py
      - name: Rebuild revisioned assets
        run: python3 build_revision_assets.py
      - name: Audit and tests
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
      - name: Release guards
        run: |
          grep -q "var VERSION = '2.38.0';" assets/app/mode-atlas-version.js
          grep -q "var CACHE_REVISION = 'assets-2.38.0';" assets/app/mode-atlas-version.js
          grep -q 'ma-trainer-stage' frontend_components.py
          grep -q 'ma-trainer-stage' reading/index.html
          grep -q 'ma-trainer-stage' writing/index.html
          grep -q 'body.trainer-session-active .ma-trainer-card' assets/css/mode-atlas-study-shared.css
          ! grep -q ':has(#startWrap\[hidden\])' assets/css/mode-atlas-study-shared.css
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/apply_2380.py .github/workflows/apply-2380-trainer.yml .github/trigger-2380.txt
          rm -rf __pycache__ .github/__pycache__
          git add -A
          git commit -m "Release Mode Atlas 2.38.0 trainer session experience"
          git push origin HEAD
