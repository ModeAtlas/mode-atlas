name: Apply Mode Atlas 2.33.2 onboarding fix

on:
  push:
    branches:
      - agent/mode-atlas-2.33.2-destination-owned-kana-setup

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.event.head_commit.message == 'Run 2.33.2 onboarding fix' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source fix
        run: python3 .github/apply_2332.py
      - name: Rebuild revisioned assets
        run: python3 build_revision_assets.py
      - name: Audit and tests
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
      - name: Release hygiene
        run: |
          grep -q "var VERSION = '2.33.2';" assets/app/mode-atlas-version.js
          grep -q "var CACHE_REVISION = 'assets-2.33.2';" assets/app/mode-atlas-version.js
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/apply_2332.py .github/workflows/apply-2332-onboarding.yml .github/trigger-2332.txt
          rm -rf __pycache__
          git add -A
          git commit -m "Release Mode Atlas 2.33.2 destination-owned Kana setup"
          git push origin HEAD
