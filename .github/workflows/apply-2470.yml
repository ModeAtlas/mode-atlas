name: Apply Mode Atlas 2.47.0

on:
  push:
    branches:
      - agent/mode-atlas-2.47.0-release-candidate-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/mode-atlas-2.47.0-release-candidate-hardening
          fetch-depth: 0

      - name: Apply 2.47.0 source fixes
        run: python3 .github/apply_2470.py

      - name: Verify public package metadata
        shell: bash
        run: |
          if grep -Eiq 'internal\.api\.openai|applied-caas|artifactory/api/npm' package-lock.json; then
            echo 'Internal npm registry URL remains in package-lock.json.' >&2
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies from public npm
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Build revisioned assets
        run: python3 build_revision_assets.py

      - name: Run project audit and Node regressions
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js

      - name: Install Chromium for browser validation
        run: npx playwright install --with-deps chromium

      - name: Run desktop and mobile smoke tests
        run: npm run test:smoke -- --project=desktop-chromium --project=mobile-chromium

      - name: Confirm release build is idempotent
        run: |
          python3 build_revision_assets.py
          python3 audit_project.py

      - name: Commit validated release
        shell: bash
        run: |
          git config user.name 'Mode Atlas Release Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Release Mode Atlas 2.47.0 RC hardening'
          git push origin HEAD:agent/mode-atlas-2.47.0-release-candidate-hardening
