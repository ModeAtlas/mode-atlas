name: Apply Mode Atlas 2.31.1 cleanup

on:
  push:
    branches:
      - agent/mode-atlas-2.31.1-ui-regression-cleanup

permissions:
  contents: write

jobs:
  apply-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply source-level UI cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected source block not found in {path}')
              p.write_text(text.replace(old, new, 1))

          replace('assets/css/mode-atlas-profile-settings.css',
          '''  .ma-settings-segmented,.ma-settings-segmented--display{min-width:0;width:100%;}\n  .ma-settings-segmented--display{--ma-segment-count:2!important;}''',
          '''  .ma-setting-row{grid-template-columns:1fr;gap:var(--ma-space-3);align-items:start;}\n  .ma-setting-row__control{justify-self:stretch;width:100%;}\n  .ma-settings-segmented,.ma-settings-segmented--display{min-width:0;width:100%;}\n  .ma-settings-segmented--display{--ma-segment-count:4!important;}''')
          replace('assets/css/mode-atlas-profile-settings.css',
          '''@media(max-width:560px){\n  .ma-shared-profile-drawer .ma-button,.ma-shared-settings-drawer .ma-button{font-size:13px;}''',
          '''@media(max-width:560px){\n  .ma-shared-profile-drawer .ma-button,.ma-shared-settings-drawer .ma-button{font-size:13px;}\n  .ma-settings-segmented--display{--ma-segment-count:2!important;}''')

          replace('assets/css/mode-atlas-study-shared.css',
          '''.start-wrap {\n        margin-top: 14px;\n        display: flex;\n        justify-content: center;\n        gap: 10px;\n        flex-wrap: wrap;\n    }''',
          '''.start-wrap {\n        margin-top: 14px;\n        display: flex;\n        justify-content: center;\n        gap: 10px;\n        flex-wrap: wrap;\n    }\n\n.start-wrap[hidden] { display: none; }''')

          replace('assets/trainer/mode-atlas-session-controls.js',
          '''    const btn = document.getElementById('pauseSessionBtn');\n    if (btn) btn.textContent = 'Pause';''',
          '''    const btn = document.getElementById('pauseSessionBtn');\n    if (btn) {\n      const label = btn.querySelector('[data-ma-pause-label]');\n      if (label) label.textContent = 'Pause';\n      else btn.textContent = 'Pause';\n    }''')

          replace('assets/css/mode-atlas-home-page.css',
          '''.ma-atlas-page .hero{\n  min-height:min(760px,calc(100svh - 74px));\n  display:grid;\n  align-items:center;\n  padding-block:clamp(48px,7vw,84px) clamp(34px,5vw,58px);\n}''',
          '''.ma-atlas-page .hero{\n  min-height:0;\n  display:grid;\n  align-items:center;\n  padding-block:clamp(34px,4.5vw,58px) clamp(30px,4vw,48px);\n}''')
          replace('assets/css/mode-atlas-home-page.css',
          '''  padding:clamp(24px,4.8vw,58px);''',
          '''  padding:clamp(24px,4.2vw,48px);''')
          replace('assets/css/mode-atlas-home-page.css',
          '''  grid-template-columns:minmax(0,1.12fr) minmax(280px,.66fr);\n  gap:clamp(26px,5vw,66px);''',
          '''  grid-template-columns:minmax(0,1fr) minmax(300px,.72fr);\n  gap:clamp(26px,4vw,52px);''')
          replace('assets/css/mode-atlas-home-page.css',
          '''  font-size:clamp(3rem,7.8vw,7.2rem);''',
          '''  font-size:clamp(3rem,6.2vw,5.8rem);''')

          version = Path('assets/app/mode-atlas-version.js')
          vt = version.read_text().replace("var VERSION = '2.31.0';", "var VERSION = '2.31.1';", 1).replace("var CACHE_REVISION = 'assets-2.31.0';", "var CACHE_REVISION = 'assets-2.31.1';", 1).replace("var BUILD_DATE = '2026-08-14';", "var BUILD_DATE = '2026-08-15';", 1)
          version.write_text(vt)

          pkg = Path('package.json')
          pkg.write_text(pkg.read_text().replace('"version": "2.31.0"', '"version": "2.31.1"', 1))

          readme = Path('README.md')
          rt = readme.read_text()
          if 'Version: 2.31.0' in rt:
              rt = rt.replace('Version: 2.31.0', 'Version: 2.31.1', 1)
          readme.write_text(rt)

          changelog = Path('CHANGELOG.md')
          ct = changelog.read_text()
          heading = '## 2.31.1 - 2026-08-15'
          if heading not in ct:
              entry = '''## 2.31.1 - 2026-08-15\n- Fixed Settings drawer responsive ownership so coarse/tablet layouts stack setting copy above controls instead of collapsing descriptions into a narrow column; Display remains four-up on tablet and becomes two-by-two on narrow phones.\n- Restored the trainer session-state contract so Start practice actually disappears while a session is active, removing the duplicated Start + Pause/End control stack and the extra vertical gap it created.\n- Preserved the Pause button SVG/label structure when session state resets, preventing the pause icon from disappearing after start/end/retry transitions.\n- Rebalanced the Atlas returning-user hero by reducing unnecessary viewport-height spacing, headline scale, card padding, and left/right imbalance while retaining the constellation identity and Continue Studying hierarchy.\n- Rechecked the new Word Bank, Focus mode, Profile, Kana, and Results responsive patterns; no competing layout owner was found in those areas, so they remain behaviorally unchanged.\n\n'''
              changelog.write_text(entry + ct)
          PY
          python3 build_revision_assets.py
          rm -f .github/workflows/apply-2311-cleanup.yml
      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
          grep -q '.start-wrap\[hidden\].*display: none' assets/css/mode-atlas-study-shared.css
          grep -q 'data-ma-pause-label' assets/trainer/mode-atlas-session-controls.js
          grep -q 'VERSION = '\''2.31.1'\''' assets/app/mode-atlas-version.js
      - name: Commit validated cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mode Atlas 2.31.1 UI regression cleanup"
          git push origin HEAD
