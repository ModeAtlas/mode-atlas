name: Apply Mode Atlas 2.39.0 trainer controller consolidation
on:
  push:
    branches:
      - agent/mode-atlas-2.39.0-trainer-controller-consolidation
    paths:
      - .github/trigger-2390.txt
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate transformer syntax
        run: python3 -m py_compile .github/apply_2390.py
      - name: Apply source consolidation
        run: python3 .github/apply_2390.py
      - name: Rebuild revisioned assets
        run: python3 build_revision_assets.py
      - name: Audit and tests
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
      - name: Controller parity report
        run: |
          python3 .github/analyze_2390.py
          echo "Reading lines: $(wc -l < assets/pages/mode-atlas-default-page.js)"
          echo "Writing lines: $(wc -l < assets/pages/mode-atlas-reverse-page.js)"
          echo "Shared controller lines: $(wc -l < assets/trainer/mode-atlas-trainer-controller.js)"
      - name: Release guards
        run: |
          grep -q "var VERSION = '2.39.0';" assets/app/mode-atlas-version.js
          grep -q "var CACHE_REVISION = 'assets-2.39.0';" assets/app/mode-atlas-version.js
          grep -q 'mode-atlas-trainer-controller.assets-2.39.0.js' reading/index.html
          grep -q 'mode-atlas-trainer-controller.assets-2.39.0.js' writing/index.html
          grep -q 'ModeAtlasTrainerController.create' assets/pages/mode-atlas-default-page.js
          grep -q 'ModeAtlasTrainerController.create' assets/pages/mode-atlas-reverse-page.js
          ! grep -q 'modeAtlasCloudDataChanged' assets/pages/mode-atlas-default-page.js
          ! grep -q 'modeAtlasCloudDataChanged' assets/pages/mode-atlas-reverse-page.js
          ! grep -q 'function debugEl' assets/pages/mode-atlas-default-page.js
          ! grep -q 'function debugEl' assets/pages/mode-atlas-reverse-page.js
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/analyze_2390.py .github/workflows/analyze-2390-controller-parity.yml .github/trigger-2390-analysis.txt
          git rm -f .github/apply_2390.py .github/workflows/apply-2390-controller.yml .github/trigger-2390.txt
          rm -rf __pycache__ .github/__pycache__
          git add -A
          git commit -m "Release Mode Atlas 2.39.0 trainer controller consolidation"
          git push origin HEAD
