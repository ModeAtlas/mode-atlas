name: Apply Mode Atlas 2.34.2 Kana interaction

on:
  push:
    branches:
      - agent/mode-atlas-2.34.2-kana-nav-interaction

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.event.head_commit.message == 'Run 2.34.2 Kana navigation interaction' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate transformer syntax
        run: python3 -m py_compile .github/apply_2342.py
      - name: Apply source changes
        run: python3 .github/apply_2342.py
      - name: Rebuild revisioned assets
        run: python3 build_revision_assets.py
      - name: Audit and tests
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
      - name: Release guards
        run: |
          grep -q 'href="/kana/" data-ma-nav-scope="product"' reading/index.html
          grep -q 'justify-content:center' assets/css/mode-atlas-navigation.css
          grep -q "var VERSION = '2.34.2';" assets/app/mode-atlas-version.js
          grep -q "var CACHE_REVISION = 'assets-2.34.2';" assets/app/mode-atlas-version.js
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/apply_2342.py .github/workflows/apply-2342-kana-interaction.yml .github/trigger-2342.txt
          rm -rf __pycache__ .github/__pycache__
          git add -A
          git commit -m "Release Mode Atlas 2.34.2 Kana navigation interaction"
          git push origin HEAD
