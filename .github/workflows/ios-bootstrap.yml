name: Bootstrap Capacitor iOS project

on:
  push:
    branches:
      - agent/mode-atlas-2.54.0-ios-foundation

permissions:
  contents: write

concurrency:
  group: mode-atlas-ios-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap-ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve Capacitor lockfile
        run: npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Build validated web payload
        run: |
          python3 build_revision_assets.py
          python3 audit_project.py
          python3 build_ios_web.py

      - name: Generate iOS project from Capacitor
        run: npx cap add ios

      - name: Sync native project
        run: npx cap sync ios

      - name: Validate Xcode project
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Remove generated web payload from project artifact
        run: rm -rf ios/App/App/public

      - name: Commit generated native project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json ios
          git rm .github/workflows/ios-bootstrap.yml
          git commit -m "Add Capacitor 8.5.2 iOS project"
          git push origin HEAD:agent/mode-atlas-2.54.0-ios-foundation
