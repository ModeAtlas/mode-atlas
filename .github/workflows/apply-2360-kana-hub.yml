name: Apply Mode Atlas 2.36.0 Kana hub refinement
on:
  push:
    branches: [agent/mode-atlas-2.36.0-kana-hub-refinement]
    paths: [.github/trigger-2360.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate transformer syntax
        run: python3 -m py_compile .github/apply_2360.py
      - name: Apply source changes
        run: python3 .github/apply_2360.py
      - name: Rebuild revisioned assets
        run: python3 build_revision_assets.py
      - name: Audit and tests
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
      - name: Release guards
        run: |
          grep -q "var VERSION = '2.36.0';" assets/app/mode-atlas-version.js
          grep -q "var CACHE_REVISION = 'assets-2.36.0';" assets/app/mode-atlas-version.js
          grep -q 'Make kana feel automatic.' kana/index.html
          grep -q 'kana-progress-overview' kana/index.html
          ! grep -q 'kana-hub-hero glass ma-card' kana/index.html
          ! grep -q 'kana-stage-card ma-card' assets/pages/mode-atlas-kana-page.js
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/apply_2360.py .github/workflows/apply-2360-kana-hub.yml .github/trigger-2360.txt
          rm -rf __pycache__ .github/__pycache__
          git add -A
          git commit -m "Release Mode Atlas 2.36.0 Kana hub refinement"
          git push origin HEAD
