name: Apply Mode Atlas 2.45 Responsive Accessibility

on:
  push:
    branches:
      - agent/mode-atlas-2.45.0-responsive-accessibility-qa
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct transformer quote assumption
        run: python3 .github/fix_2450_transformer.py
      - name: Validate transformer
        run: python3 -m py_compile .github/apply_2450.py
      - name: Apply source fixes
        run: python3 .github/apply_2450.py
      - name: Re-render shared frontend owners
        run: python3 frontend_components.py
      - name: Validate changed JavaScript syntax
        run: |
          node --check assets/app/mode-atlas-dialog.js
          node --check assets/trainer/mode-atlas-trainer-controller.js
          node --check assets/trainer/mode-atlas-trainer-shared.js
          node --check tests/frontend.test.js
      - name: Rebuild revisioned assets
        run: python3 build_revision_assets.py
      - name: Audit and tests
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
      - name: Release guards
        run: |
          grep -q "var VERSION = '2.45.0';" assets/app/mode-atlas-version.js
          grep -q "var CACHE_REVISION = 'assets-2.45.0';" assets/app/mode-atlas-version.js
          grep -q 'class="ma-skip-link" href="#mainContent"' reading/index.html
          grep -q '<main id="mainContent" class="app-shell ma-trainer-shell"' writing/index.html
          grep -q 'aria-controls="scoresContent"' reading/index.html
          grep -q 'aria-controls="modifiersContent"' writing/index.html
          grep -q 'document.createElement("button")' assets/trainer/mode-atlas-trainer-shared.js
          grep -q 'aria-describedby' assets/app/mode-atlas-dialog.js
          grep -q '@media(pointer:coarse)' assets/css/mode-atlas-navigation.css
          git diff --check
      - name: Commit validated release
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/apply_2450.py .github/fix_2450_transformer.py .github/qa_245.py .github/workflows/apply-2450-responsive-accessibility.yml .github/workflows/qa-245-responsive-accessibility.yml
          rm -rf __pycache__ .github/__pycache__
          git add -A
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
          git commit -m "Release Mode Atlas 2.45.0 responsive accessibility QA"
          git push origin HEAD
