name: Apply Mode Atlas 2.34.1 Kana flyout

on:
  push:
    branches:
      - agent/mode-atlas-2.34.1-kana-nav-flyout

permissions:
  contents: write

jobs:
  validate:
    if: ${{ github.event.head_commit.message == 'Run 2.34.1 Kana flyout release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate transformer syntax
        run: python3 -m py_compile .github/apply_2341.py
      - name: Apply source changes
        run: python3 .github/apply_2341.py
      - name: Rebuild revisioned assets
        run: python3 build_revision_assets.py
      - name: Audit and tests
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
      - name: Kana flyout release guards
        run: |
          grep -q 'data-ma-kana-menu-trigger' reading/index.html
          grep -q 'mode-atlas-navigation-menu.assets-2.34.1.js' reading/index.html
          ! grep -q 'ma-nav--has-subnav' reading/index.html
          grep -q "var VERSION = '2.34.1';" assets/app/mode-atlas-version.js
          grep -q "var CACHE_REVISION = 'assets-2.34.1';" assets/app/mode-atlas-version.js
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/apply_2341.py .github/workflows/apply-2341-kana-flyout.yml .github/trigger-2341.txt
          rm -rf __pycache__ .github/__pycache__
          git add -A
          git commit -m "Release Mode Atlas 2.34.1 compact Kana navigation flyout"
          git push origin HEAD
