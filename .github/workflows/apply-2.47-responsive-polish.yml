name: Apply final 2.47 responsive polish

on:
  push:
    branches:
      - agent/mode-atlas-2.47.0-release-candidate-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mode-atlas-2.47.0-release-candidate-hardening
          fetch-depth: 0

      - name: Correct temporary transformer assertions
        run: sed -i 's/expected=2/expected=1/g' .github/scripts/apply-2.47-responsive-polish.py

      - name: Apply scoped responsive source fixes
        run: python3 .github/scripts/apply-2.47-responsive-polish.py

      - name: Align legacy trainer geometry and regression contract
        run: python3 .github/scripts/finalize-2.47-responsive-polish.py

      - name: Rebuild active revision assets
        run: python3 build_revision_assets.py

      - name: Validate scoped source
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
          git diff --check

      - name: Commit responsive fixes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Mode Atlas Release Bot"
          git config user.email "48079170+ModeAtlas@users.noreply.github.com"
          git add assets/ui/mode-atlas-profile-drawer-bindings.js assets/ui/mode-atlas-profile-drawer-bindings.assets-2.47.0.js assets/css/mode-atlas-navigation.css assets/css/mode-atlas-navigation.assets-2.47.0.css assets/css/mode-atlas-profile-settings.css assets/css/mode-atlas-profile-settings.assets-2.47.0.css assets/css/mode-atlas-study-shared.css assets/css/mode-atlas-study-shared.assets-2.47.0.css tests/frontend.test.js tests/smoke.spec.js
          git commit -m "Fix phone and tablet release layouts"
          git push origin HEAD:agent/mode-atlas-2.47.0-release-candidate-hardening