name: Apply Mode Atlas 2.31.0 release

on:
  push:
    branches:
      - agent/mode-atlas-2.31.0-ui-standardisation

permissions:
  contents: write

jobs:
  apply-release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify release patch
        shell: bash
        run: |
          set -euo pipefail
          cat .mode-atlas-release/patch-*.b64 | base64 -d | gunzip > /tmp/mode-atlas-2.31.patch
          echo "427790f4f2fdf5985056fb761cbe6df15c75074890668fc6af73b0322b48e4bc  /tmp/mode-atlas-2.31.patch" | sha256sum -c -
          git apply --check /tmp/mode-atlas-2.31.patch
          git apply /tmp/mode-atlas-2.31.patch
          rm -rf .mode-atlas-release

      - name: Validate Mode Atlas 2.31.0
        shell: bash
        run: |
          set -euo pipefail
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js

      - name: Commit validated release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Mode Atlas 2.31.0 UI standardisation"
          git push origin HEAD
