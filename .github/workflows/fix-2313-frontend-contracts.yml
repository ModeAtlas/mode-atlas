name: Fix Mode Atlas 2.31.3 frontend contracts
on:
  push:
    branches:
      - agent/mode-atlas-2.31.3-ui-simplification
permissions:
  contents: write
jobs:
  fix-tests:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update superseded Word Bank test assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/frontend.test.js')
          t = p.read_text()
          old1 = '  assert.match(wordbankHtml, /<details class="wordbank-tools">/);'
          new1 = '  assert.match(wordbankHtml, /id="wordBankActionsBtn"/);\n  assert.doesNotMatch(wordbankHtml, /<details class="wordbank-tools">/);'
          old2 = '  assert.match(wordbank, /<details class="wordbank-tools">/);'
          new2 = '  assert.match(wordbank, /id="wordBankActionsBtn"/);\n  assert.doesNotMatch(wordbank, /<details class="wordbank-tools">/);'
          if t.count(old1) != 1 or t.count(old2) != 1:
              raise SystemExit(f'Unexpected Word Bank stale assertion counts: {t.count(old1)}, {t.count(old2)}')
          t = t.replace(old1, new1, 1).replace(old2, new2, 1)
          p.write_text(t)
          PY
          rm -f .github/workflows/fix-2313-frontend-contracts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update Word Bank frontend contracts for 2.31.3"
          git push origin HEAD
