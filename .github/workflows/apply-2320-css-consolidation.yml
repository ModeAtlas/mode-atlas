name: Apply Mode Atlas 2.32.0 CSS source consolidation

on:
  push:
    branches:
      - agent/mode-atlas-2.32.0-css-source-consolidation

permissions:
  contents: write

jobs:
  consolidate:
    if: ${{ github.event.head_commit.message == 'Apply 2.32.0 CSS source consolidation' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install CSS parser
        run: python3 -m pip install --disable-pip-version-check tinycss2
      - name: Consolidate canonical CSS
        run: python3 .github/consolidate_2320.py
      - name: Rebuild revisioned assets
        run: python3 build_revision_assets.py
      - name: Audit and regression tests
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/consolidate_2320.py
          git rm .github/workflows/apply-2320-css-consolidation.yml
          git rm -f .github/trigger-2320.txt || true
          git add -A
          git commit -m "Release Mode Atlas 2.32.0 CSS source consolidation"
          git push origin HEAD
