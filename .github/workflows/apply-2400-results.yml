name: Apply Mode Atlas 2.40.0 formal Test Results
on:
  push:
    branches:
      - agent/mode-atlas-2.40.0-formal-test-results
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Narrow hero transform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/apply_2400.py')
          text = path.read_text()
          old = "css = one(css, '        font-size: 44px;', '        font-size: 38px;', 'hero heading size')"
          new = "css = css.replace('h1 {\\n        margin: 0 0 10px;\\n        font-size: 44px;', 'h1 {\\n        margin: 0 0 10px;\\n        font-size: 38px;', 1)"
          assert text.count(old) == 1
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate transformer syntax
        run: python3 -m py_compile .github/apply_2400.py
      - name: Apply source changes
        run: python3 .github/apply_2400.py
      - name: Make trainer order regression revision-aware
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/frontend.test.js')
          text = path.read_text()
          old = '''    const sharedIndex = html.indexOf('mode-atlas-trainer-controller.assets-2.39.0.js');
              const pageIndex = Math.max(html.indexOf('mode-atlas-default-page.assets-2.39.0.js'), html.indexOf('mode-atlas-reverse-page.assets-2.39.0.js'));'''.replace('              ', '    ')
          new = '''    const sharedIndex = html.indexOf(`mode-atlas-trainer-controller.${REVISION}.js`);
    const pageIndex = Math.max(html.indexOf(`mode-atlas-default-page.${REVISION}.js`), html.indexOf(`mode-atlas-reverse-page.${REVISION}.js`));'''
          assert text.count(old) == 1, 'stale 2.39 controller order assertion not found exactly once'
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Rebuild revisioned assets
        run: python3 build_revision_assets.py
      - name: Audit and tests
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
      - name: Release guards
        run: |
          grep -q "var VERSION = '2.40.0';" assets/app/mode-atlas-version.js
          grep -q "var CACHE_REVISION = 'assets-2.40.0';" assets/app/mode-atlas-version.js
          grep -q 'Test Mode only · practice sessions are not included' results/index.html
          grep -q 'id="testHeatmap"' results/index.html
          grep -q 'id="rowPerformanceMount"' results/index.html
          grep -q 'row-doughnut-card' assets/results/mode-atlas-results-ui.js
          grep -q 'function isFormalTestResultRecord' assets/results/mode-atlas-results-engine.js
          grep -q 'mode-atlas-trainer-controller.${REVISION}.js' tests/frontend.test.js
          ! grep -E 'scoreHistory|dailyHistory|speedRunTop3|endlessBest' assets/pages/mode-atlas-test-page.js
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/apply_2400.py .github/workflows/apply-2400-results.yml
          rm -rf __pycache__ .github/__pycache__
          git add -A
          git commit -m "Release Mode Atlas 2.40.0 formal Test Results"
          git push origin HEAD
