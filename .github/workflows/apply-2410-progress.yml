name: Apply Mode Atlas 2.41.0 Atlas Level
on:
  push:
    branches:
      - agent/mode-atlas-2.41.0-atlas-level-progression
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate transformer
        run: python3 -m py_compile .github/apply_2410.py .github/fix_2410_test.py
      - name: Apply source changes
        run: python3 .github/apply_2410.py
      - name: Correct progression test boundary
        run: python3 .github/fix_2410_test.py
      - name: Validate progression syntax
        run: node --check assets/app/mode-atlas-progress.js
      - name: Rebuild revisioned assets
        run: python3 build_revision_assets.py
      - name: Audit and tests
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
      - name: Release guards
        run: |
          grep -q "var VERSION = '2.41.0';" assets/app/mode-atlas-version.js
          grep -q "var CACHE_REVISION = 'assets-2.41.0';" assets/app/mode-atlas-version.js
          grep -q "mode-atlas-progress.assets-2.41.0.js" reading/index.html
          grep -q "mode-atlas-progress.assets-2.41.0.js" writing/index.html
          grep -q "mode-atlas-progress.assets-2.41.0.js" index.html
          grep -q "Atlas Level" assets/ui/mode-atlas-profile-menu.js
          grep -q "ModeAtlasProgress?.mergeStates" cloud-sync.js
          grep -q "kana.reading.correct" assets/pages/mode-atlas-default-page.js
          grep -q "kana.writing.correct" assets/pages/mode-atlas-reverse-page.js
          python3 - <<'PY'
          from pathlib import Path
          text=Path('assets/app/mode-atlas-storage.js').read_text()
          backup=text.split('const APP_BACKUP_EXACT',1)[1].split('const APP_LOCAL_EXACT',1)[0]
          assert 'modeAtlasProgressDeviceId' not in backup
          assert 'modeAtlasProgressDeviceId' in text.split('const APP_LOCAL_EXACT',1)[1]
          PY
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/apply_2410.py .github/fix_2410_test.py .github/workflows/apply-2410-progress.yml
          rm -rf __pycache__ .github/__pycache__
          git add -A
          git commit -m "Release Mode Atlas 2.41.0 Atlas Level progression"
          git push origin HEAD
