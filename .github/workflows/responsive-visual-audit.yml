name: Temporary responsive visual audit

on:
  push:
    branches: [agent/mode-atlas-2.47.0-release-candidate-hardening]

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --registry=https://registry.npmjs.org/
      - run: npx playwright install --with-deps chromium
      - name: Capture responsive layouts
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/mode-atlas-http.log 2>&1 &
          for i in {1..20}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break || sleep .25; done
          mkdir -p responsive-audit
          cat > responsive-audit-runner.js <<'NODE'
          const { chromium } = require('@playwright/test');
          const fs = require('fs');
          const path = require('path');
          const base = 'http://127.0.0.1:4173';
          const routes = [['home','/'],['kana','/kana/'],['reading','/reading/'],['writing','/writing/']];
          const scenarios = [
            ['phone-portrait','phone',390,844,true,true],
            ['tablet-portrait','tablet',820,1180,true,true],
            ['tablet-landscape','tablet',1180,820,true,true],
            ['tablet-explicit-desktop','tablet',1366,1024,false,false]
          ];
          const readingSettings = {focusWeak:false,dakuten:false,yoon:false,extendedKatakana:false,hint:false,srs:false,mobileMode:false,endless:false,timeTrial:false,speedRun:false,dailyChallenge:false,testMode:false,comboKana:false,comboMode:'random',hiraganaRows:['h_a'],katakanaRows:[],statsVisible:true,scoresVisible:true,activeBottomTab:null};
          const writingSettings = {...readingSettings,keyboardMode:false,keyboardInputType:'kana',choiceCount:4};
          function seed(mode){
            localStorage.clear();
            for (const key of ['modeAtlasStarterSeen','modeAtlasOnboardingComplete','modeAtlasKanaSetupComplete','modeAtlasLegalAccepted']) localStorage.setItem(key,'true');
            localStorage.setItem('modeAtlasLegalAcceptedAt',String(Date.now()));
            localStorage.setItem('modeAtlasLegalVersion','2026-05');
            localStorage.setItem('maWhatsNewSeen','responsive-audit');
            localStorage.setItem('modeAtlasDisplayMode',mode);
            localStorage.setItem('settings',JSON.stringify(readingSettings));
            localStorage.setItem('reverseSettings',JSON.stringify(writingSettings));
            for (const key of ['charStats','reverseCharStats','charTimes','reverseCharTimes','charSrs','reverseCharSrs','dailyChallengeHistory','reverseDailyChallengeHistory']) localStorage.setItem(key,'{}');
            localStorage.setItem('scoreHistory',JSON.stringify({endlessBest:{total:0,correct:0,wrong:0},speedRunTop3:[],comboKanaBest:{same_row:0,random:0},timeTrialTop3:[]}));
            localStorage.setItem('reverseScoreHistory',JSON.stringify({endlessBest:{total:0,correct:0,wrong:0},speedRunTop3:[],comboKanaBest:{same_row:0,random:0},timeTrialTop3:[]}));
            localStorage.setItem('highScore','0'); localStorage.setItem('reverseHighScore','0');
          }
          (async()=>{
            const browser = await chromium.launch({headless:true});
            for (const [scenario,mode,width,height,hasTouch,isMobile] of scenarios){
              const context = await browser.newContext({viewport:{width,height},hasTouch,isMobile,deviceScaleFactor:1});
              await context.addInitScript(seed,mode);
              const page = await context.newPage();
              await page.route(/https:\/\/(www\.)?(gstatic|googleapis)\.com\/.*/,r=>r.abort());
              for (const [slug,route] of routes){
                await page.goto(base+route,{waitUntil:'commit',timeout:10000});
                await page.waitForTimeout(1400);
                const prefix=path.join('responsive-audit',`${scenario}-${slug}`);
                await page.screenshot({path:prefix+'-viewport.png',fullPage:false});
                await page.screenshot({path:prefix+'-full.png',fullPage:true});
                const metrics=await page.evaluate(()=>({viewport:[innerWidth,innerHeight],scroll:[document.documentElement.scrollWidth,document.documentElement.scrollHeight],mode:document.body.dataset.effectiveDisplayMode||'',bodyClasses:document.body.className}));
                fs.appendFileSync('responsive-audit/metrics.jsonl',JSON.stringify({scenario,slug,...metrics})+'\n');
                if(slug==='kana'){
                  const settings=page.locator('[data-settings-open]:visible').first();
                  if(await settings.count()){await settings.click();await page.waitForTimeout(350);await page.screenshot({path:prefix+'-settings.png'});await page.locator('#settingsCloseBtn').click();}
                  const profile=page.locator('#profileOpenBtn');
                  if(await profile.count()){await profile.click();await page.waitForTimeout(350);await page.screenshot({path:prefix+'-profile.png'});await page.locator('#profileCloseBtn').click();}
                }
                if(slug==='reading'||slug==='writing'){
                  const start=page.locator('#startBtn');
                  if(await start.count()&&await start.isVisible()){await start.click();await page.waitForTimeout(450);await page.screenshot({path:prefix+'-session.png'});}
                }
              }
              await context.close();
            }
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
          node responsive-audit-runner.js
          rm responsive-audit-runner.js
      - name: Upload responsive audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-visual-audit-${{ github.sha }}
          path: responsive-audit
          if-no-files-found: error
          retention-days: 3
