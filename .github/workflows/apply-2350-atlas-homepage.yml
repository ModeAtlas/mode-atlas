name: Apply Mode Atlas 2.35.0 Atlas homepage refinement
on:
  push:
    branches: [agent/mode-atlas-2.35.0-atlas-homepage-refinement]
    paths: [.github/trigger-2350.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate transformer syntax
        run: python3 -m py_compile .github/apply_2350.py .github/fix_2350_tests.py
      - name: Apply source changes
        run: |
          python3 .github/apply_2350.py
          python3 .github/fix_2350_tests.py
      - name: Rebuild revisioned assets
        run: python3 build_revision_assets.py
      - name: Audit and tests
        run: |
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
      - name: Release guards
        run: |
          grep -q "var VERSION = '2.35.0';" assets/app/mode-atlas-version.js
          grep -q "var CACHE_REVISION = 'assets-2.35.0';" assets/app/mode-atlas-version.js
          grep -q 'Build Japanese skills that stick.' index.html
          grep -q 'atlas-showcase' index.html
          ! grep -q 'class="constellation"' index.html
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"
      - name: Commit validated release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/apply_2350.py .github/fix_2350_tests.py .github/workflows/apply-2350-atlas-homepage.yml .github/trigger-2350.txt
          rm -rf __pycache__ .github/__pycache__
          git add -A
          git commit -m "Release Mode Atlas 2.35.0 Atlas homepage refinement"
          git push origin HEAD
