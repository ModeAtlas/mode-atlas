name: Temporary responsive formatting source applier

on:
  push:
    branches:
      - agent/mode-atlas-2.47.0-release-candidate-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Run responsive formatting source applier'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mode-atlas-2.47.0-responsive-format-fixes
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply responsive fixes to isolated branch
        run: python3 .github/apply-responsive-format-fixes.py
      - name: Build and validate source
        run: |
          python3 build_revision_assets.py
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
          git diff --check
      - name: Commit responsive fixes
        shell: bash
        run: |
          git config user.name 'Mode Atlas Release Bot'
          git config user.email '48079170+ModeAtlas@users.noreply.github.com'
          git add assets/css assets/ui tests
          if git diff --cached --quiet; then
            echo 'No responsive source changes produced.' >&2
            exit 1
          fi
          git commit -m 'Fix phone and tablet formatting regressions'
          git push origin HEAD:agent/mode-atlas-2.47.0-responsive-format-fixes
