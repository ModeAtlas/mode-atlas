name: Temporary responsive layout source applier

on:
  push:
    branches:
      - agent/mode-atlas-2.47.0-release-candidate-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Add temporary responsive layout source applier'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mode-atlas-2.47.0-release-candidate-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply responsive source rewrite
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')

          # Navigation: replace the previous Phone-only explicit composition with
          # one clear owner for both explicit Tablet and Phone navigation.
          p=root/'assets/css/mode-atlas-navigation.css'
          s=p.read_text()
          start=s.index('/* Explicit Phone mode uses the same compact composition')
          end=s.index('\nhtml[data-ma-theme="light"] .ma-nav__action', start)
          block='''/* Explicit display modes own their navigation composition independently of
             pointer type or physical viewport width. Tablet stays a compact single row;
             Phone uses a denser two-row product navigation. */
          body[data-effective-display-mode="tablet"] .ma-nav{
            position:sticky;
            top:max(10px,env(safe-area-inset-top,0px));
            width:min(1120px,calc(100% - 24px));
            margin:12px auto 18px;
            padding:8px 10px;
            display:flex;
            grid-template-columns:none;
            align-items:center;
            gap:10px;
            border-radius:20px;
          }
          body[data-effective-display-mode="tablet"] .ma-nav__brand{grid-column:auto;max-width:174px;flex:0 1 174px;gap:9px;}
          body[data-effective-display-mode="tablet"] .ma-nav__mark{width:40px;height:40px;flex-basis:40px;border-radius:13px;}
          body[data-effective-display-mode="tablet"] .ma-nav__kicker{display:none;}
          body[data-effective-display-mode="tablet"] .ma-nav__title{font-size:.84rem;}
          body[data-effective-display-mode="tablet"] .ma-nav__content{display:grid;min-width:0;flex:1 1 auto;gap:0;}
          body[data-effective-display-mode="tablet"] .ma-nav__primary{display:flex;min-width:0;align-items:center;justify-content:flex-end;gap:6px;}
          body[data-effective-display-mode="tablet"] .ma-nav__links{width:auto;gap:4px;}
          body[data-effective-display-mode="tablet"] .ma-nav__link{min-height:40px;padding:0 10px;font-size:.77rem;}
          body[data-effective-display-mode="tablet"] .ma-nav__actions{gap:5px;}
          body[data-effective-display-mode="tablet"] .ma-nav__profile{width:auto;min-width:0;min-height:40px;padding:0 7px 0 5px;}
          body[data-effective-display-mode="tablet"] .ma-nav__profile .ma-nav__action-label{display:inline-flex;}
          body[data-effective-display-mode="tablet"] .ma-nav__settings{width:40px;min-width:40px;min-height:40px;padding:0;}
          body[data-effective-display-mode="tablet"] .ma-nav__avatar{width:28px;height:28px;min-width:28px;}
          body[data-effective-display-mode="tablet"] .ma-nav__focus{display:none;}

          body[data-effective-display-mode="phone"] .ma-nav{
            position:relative;
            top:auto;
            width:calc(100% - 12px);
            margin:6px auto 12px;
            padding:8px;
            display:grid;
            grid-template-columns:minmax(0,1fr) auto;
            gap:7px;
            border-radius:20px;
          }
          body[data-effective-display-mode="phone"] .ma-nav__brand{grid-column:1;max-width:none;gap:8px;}
          body[data-effective-display-mode="phone"] .ma-nav__mark{width:36px;height:36px;flex-basis:36px;border-radius:12px;}
          body[data-effective-display-mode="phone"] .ma-nav__kicker{display:none;}
          body[data-effective-display-mode="phone"] .ma-nav__title{font-size:.8rem;}
          body[data-effective-display-mode="phone"] .ma-nav__content,
          body[data-effective-display-mode="phone"] .ma-nav__primary{display:contents;}
          body[data-effective-display-mode="phone"] .ma-nav__links{grid-column:1 / -1;grid-row:2;width:100%;justify-content:space-between;gap:3px;}
          body[data-effective-display-mode="phone"] .ma-nav__actions{grid-column:2;grid-row:1;justify-self:end;gap:4px;}
          body[data-effective-display-mode="phone"] .ma-nav__link{min-height:36px;padding:0 7px;font-size:.72rem;}
          body[data-effective-display-mode="phone"] .ma-nav__profile{width:auto;min-width:0;min-height:38px;padding:0 6px 0 4px;}
          body[data-effective-display-mode="phone"] .ma-nav__profile .ma-nav__action-label{display:inline-flex;}
          body[data-effective-display-mode="phone"] .ma-nav__settings{width:38px;min-width:38px;min-height:38px;padding:0;}
          body[data-effective-display-mode="phone"] .ma-nav__avatar{width:28px;height:28px;min-width:28px;}
          body[data-effective-display-mode="phone"] .ma-nav__flyout{left:0;width:min(268px,calc(100vw - 18px));transform:translateY(-5px);}
          body[data-effective-display-mode="phone"] .ma-nav__menu:hover .ma-nav__flyout,
          body[data-effective-display-mode="phone"] .ma-nav__menu:focus-within .ma-nav__flyout,
          body[data-effective-display-mode="phone"] .ma-nav__menu.is-open .ma-nav__flyout{transform:translateY(0);}
          body[data-effective-display-mode="phone"] .ma-nav__focus{display:none;}
          '''
          p.write_text(s[:start]+block+s[end:])

          # Atlas page: make explicit display modes own composition instead of
          # relying only on physical-width media queries.
          p=root/'assets/css/mode-atlas-home-page.css'
          s=p.read_text()
          marker='@media(prefers-reduced-motion:reduce){.atlas-preview{transform:none;}}'
          block='''/* Saved display modes own the page composition as well as the global shell.
             This keeps Tablet and Phone visually distinct even on a wider device. */
          body[data-effective-display-mode="tablet"].ma-atlas-page .shell{--ma-page-max:1100px;}
          body[data-effective-display-mode="tablet"] .atlas-hero{padding-block:56px 72px;}
          body[data-effective-display-mode="tablet"] .atlas-hero__stage{grid-template-columns:minmax(0,1fr) minmax(340px,.82fr);gap:42px;}
          body[data-effective-display-mode="tablet"] .atlas-hero h1{max-width:9.6ch;font-size:clamp(4rem,7vw,5.4rem);}
          body[data-effective-display-mode="tablet"] .atlas-hero__lead{max-width:560px;margin-top:22px;font-size:1.04rem;}
          body[data-effective-display-mode="tablet"] .home-continue{margin-top:28px;}
          body[data-effective-display-mode="tablet"] .atlas-showcase{min-height:430px;}
          body[data-effective-display-mode="tablet"] .atlas-tools{padding-block:58px;}
          body[data-effective-display-mode="tablet"] .atlas-section-intro{margin-bottom:44px;}
          body[data-effective-display-mode="tablet"] .atlas-section-intro h2,
          body[data-effective-display-mode="tablet"] .atlas-future h2{font-size:clamp(2.7rem,5vw,3.7rem);}
          body[data-effective-display-mode="tablet"] .atlas-product{grid-template-columns:minmax(0,.92fr) minmax(340px,1.08fr);gap:44px;min-height:370px;padding-block:56px;}
          body[data-effective-display-mode="tablet"] .atlas-product h3{font-size:clamp(2.45rem,4.5vw,3.35rem);}
          body[data-effective-display-mode="tablet"] .atlas-future{padding-block:58px;}

          body[data-effective-display-mode="phone"].ma-atlas-page .shell{--ma-page-max:none;}
          body[data-effective-display-mode="phone"] .atlas-hero{padding-block:28px 42px;}
          body[data-effective-display-mode="phone"] .atlas-hero__stage{grid-template-columns:1fr;gap:26px;}
          body[data-effective-display-mode="phone"] .atlas-eyebrow{margin-bottom:14px;}
          body[data-effective-display-mode="phone"] .atlas-hero h1{max-width:10ch;font-size:clamp(2.85rem,12.5vw,3.35rem);line-height:.92;}
          body[data-effective-display-mode="phone"] .atlas-hero__lead{margin-top:18px;font-size:.96rem;line-height:1.55;}
          body[data-effective-display-mode="phone"] .home-continue{gap:12px;margin-top:22px;padding:14px 0;}
          body[data-effective-display-mode="phone"] .atlas-text-link--returning{margin-top:12px;}
          body[data-effective-display-mode="phone"] .atlas-showcase{min-height:320px;}
          body[data-effective-display-mode="phone"] .atlas-preview--reading{top:36px;min-height:250px;}
          body[data-effective-display-mode="phone"] .atlas-preview__prompt{min-height:94px;font-size:3.8rem;}
          body[data-effective-display-mode="phone"] .atlas-preview--words{min-height:188px;}
          body[data-effective-display-mode="phone"] .atlas-preview--writing{min-height:154px;}
          body[data-effective-display-mode="phone"] .atlas-writing-preview{gap:11px;padding:14px 12px;}
          body[data-effective-display-mode="phone"] .atlas-writing-preview>span{font-size:1.5rem;}
          body[data-effective-display-mode="phone"] .atlas-writing-preview b{min-height:36px;}
          body[data-effective-display-mode="phone"] .atlas-tools{padding-block:38px;}
          body[data-effective-display-mode="phone"] .atlas-section-intro{margin-bottom:30px;}
          body[data-effective-display-mode="phone"] .atlas-section-intro h2,
          body[data-effective-display-mode="phone"] .atlas-future h2{font-size:2.35rem;}
          body[data-effective-display-mode="phone"] .atlas-section-intro p,
          body[data-effective-display-mode="phone"] .atlas-future__copy p{margin-top:13px;font-size:.94rem;line-height:1.55;}
          body[data-effective-display-mode="phone"] .atlas-product{grid-template-columns:1fr;gap:26px;min-height:0;padding-block:38px;}
          body[data-effective-display-mode="phone"] .atlas-product--words .atlas-product__copy,
          body[data-effective-display-mode="phone"] .atlas-product--words .atlas-product__visual{order:initial;}
          body[data-effective-display-mode="phone"] .atlas-product h3{margin-top:13px;font-size:2.35rem;}
          body[data-effective-display-mode="phone"] .atlas-product__copy>p{margin-top:14px;font-size:.94rem;line-height:1.55;}
          body[data-effective-display-mode="phone"] .atlas-product__action{margin-top:20px;}
          body[data-effective-display-mode="phone"] .atlas-kana-visual{padding:16px;}
          body[data-effective-display-mode="phone"] .atlas-mode-card{min-height:68px;gap:12px;padding:10px 12px;}
          body[data-effective-display-mode="phone"] .atlas-benefits{gap:30px;padding-block:40px;}
          body[data-effective-display-mode="phone"] .atlas-future{gap:26px;padding-block:42px;}

          @media(max-width:900px){
            body[data-effective-display-mode="tablet"] .atlas-hero__stage{grid-template-columns:1fr;gap:32px;}
            body[data-effective-display-mode="tablet"] .atlas-showcase{min-height:390px;max-width:720px;width:100%;margin-inline:auto;}
            body[data-effective-display-mode="tablet"] .atlas-product{grid-template-columns:1fr;gap:32px;min-height:0;}
            body[data-effective-display-mode="tablet"] .atlas-product--words .atlas-product__copy,
            body[data-effective-display-mode="tablet"] .atlas-product--words .atlas-product__visual{order:initial;}
            body[data-effective-display-mode="tablet"] .atlas-product__visual{max-width:760px;width:100%;}
          }
          '''
          if block not in s:
            assert marker in s
            s=s.replace(marker,block+'\n'+marker)
          p.write_text(s)

          # Kana page: explicit mode density and compact Phone progress matrices.
          p=root/'assets/css/mode-atlas-kana-page.css'
          s=p.read_text()
          marker='@media(prefers-reduced-motion:reduce){.kana-pathway,.kana-next-card--recommended,.kana-stage-card{transition:none;}}'
          block='''/* Explicit display modes own Kana page density as well as the shared shell.
             Tablet uses the available touch workspace; Phone keeps progress scannable
             without turning every compact metric into a full-width row. */
          body[data-effective-display-mode="tablet"].ma-kana-page{padding-left:18px;padding-right:18px;}
          body[data-effective-display-mode="tablet"].ma-kana-page .shell{width:min(1100px,100%);}
          body[data-effective-display-mode="tablet"] .kana-hub-hero{width:100%;grid-template-columns:minmax(0,1fr) minmax(320px,.72fr);gap:44px;padding:54px 0 66px;}
          body[data-effective-display-mode="tablet"] .kana-hero-main h1{font-size:clamp(4rem,7vw,5.2rem);}
          body[data-effective-display-mode="tablet"] .kana-hero-lead{margin-top:20px;font-size:1.02rem;}
          body[data-effective-display-mode="tablet"] .kana-hero-actions{margin-top:26px;}
          body[data-effective-display-mode="tablet"] .kana-hero-visual{min-height:300px;}
          body[data-effective-display-mode="tablet"] .kana-pathways{padding:54px 0 64px;}
          body[data-effective-display-mode="tablet"] .kana-section{padding-block:54px;}
          body[data-effective-display-mode="tablet"] .kana-section-head{margin-bottom:34px;}
          body[data-effective-display-mode="tablet"] .kana-section-head h2{font-size:clamp(2.35rem,4.3vw,3rem);}
          body[data-effective-display-mode="tablet"] .kana-record-layout{gap:28px;}

          body[data-effective-display-mode="phone"].ma-kana-page{padding-left:8px;padding-right:8px;padding-bottom:18px;}
          body[data-effective-display-mode="phone"].ma-kana-page .shell{width:100%;}
          body[data-effective-display-mode="phone"] .kana-hub-hero{grid-template-columns:1fr;padding:24px 4px 34px;gap:20px;}
          body[data-effective-display-mode="phone"] .hero-tagline{margin-bottom:12px;}
          body[data-effective-display-mode="phone"] .hero-tagline>span:first-child{width:36px;height:36px;border-radius:12px;}
          body[data-effective-display-mode="phone"] .kana-hero-main h1{max-width:10ch;font-size:clamp(2.9rem,13vw,3.35rem);line-height:.92;}
          body[data-effective-display-mode="phone"] .kana-hero-lead{margin-top:16px;font-size:.94rem;line-height:1.55;}
          body[data-effective-display-mode="phone"] .kana-hero-actions{margin-top:20px;}
          body[data-effective-display-mode="phone"] .kana-primary-action{--ma-button-min-height:52px;--ma-button-radius:16px;width:100%;max-width:none;}
          body[data-effective-display-mode="phone"] .kana-hero-visual{min-height:150px;max-width:360px;}
          body[data-effective-display-mode="phone"] .kana-hero-script strong{font-size:2.35rem;}
          body[data-effective-display-mode="phone"] .kana-hero-script span{font-size:1.25rem;}
          body[data-effective-display-mode="phone"] .kana-hero-glyph--a{width:52px;height:52px;font-size:1.3rem;}
          body[data-effective-display-mode="phone"] .kana-hero-glyph--ka{width:60px;height:60px;font-size:1.55rem;}
          body[data-effective-display-mode="phone"] .kana-hero-glyph--yo{display:none;}
          body[data-effective-display-mode="phone"] .kana-pathways{padding:34px 4px 40px;}
          body[data-effective-display-mode="phone"] .kana-pathway{padding:20px 2px;}
          body[data-effective-display-mode="phone"] .kana-progress-intro{padding:38px 2px 22px;}
          body[data-effective-display-mode="phone"] .kana-section{padding-block:36px;}
          body[data-effective-display-mode="phone"] .kana-section-head{margin-bottom:24px;}
          body[data-effective-display-mode="phone"] .kana-section-head h2{font-size:2.15rem;}
          body[data-effective-display-mode="phone"] .kana-section-head p{font-size:.9rem;line-height:1.5;}
          body[data-effective-display-mode="phone"] .kana-next-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:0;}
          body[data-effective-display-mode="phone"] .kana-next-card--recommended{grid-column:1 / -1;padding:18px;margin:0 0 8px;}
          body[data-effective-display-mode="phone"] .kana-next-card--secondary{min-width:0;padding:16px 10px;border-top:1px solid var(--ma-border);}
          body[data-effective-display-mode="phone"] .kana-next-card--secondary:nth-child(2){border-left:0;border-right:1px solid var(--ma-border);}
          body[data-effective-display-mode="phone"] .kana-mastery-grid,
          body[data-effective-display-mode="phone"] .kana-preset-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
          body[data-effective-display-mode="phone"] .kana-stage-card,
          body[data-effective-display-mode="phone"] .kana-preset-card{padding:15px;border-right:1px solid var(--ma-border);border-bottom:1px solid var(--ma-border)!important;}
          body[data-effective-display-mode="phone"] .kana-stage-card:nth-child(2n),
          body[data-effective-display-mode="phone"] .kana-preset-card:nth-child(2n){border-right:0;}
          body[data-effective-display-mode="phone"] .kana-stage-card:nth-last-child(-n+2),
          body[data-effective-display-mode="phone"] .kana-preset-card:nth-last-child(-n+2){border-bottom:0!important;}
          body[data-effective-display-mode="phone"] .kana-preset-card p{min-height:0;margin:8px 0 12px;font-size:.68rem;}
          body[data-effective-display-mode="phone"] .kana-mastery-focus{grid-template-columns:repeat(2,minmax(0,1fr));}
          body[data-effective-display-mode="phone"] .kana-focus-card{min-width:0;padding:16px 10px;border-right:1px solid var(--ma-border);border-bottom:0;}
          body[data-effective-display-mode="phone"] .kana-focus-card:nth-child(2){border-right:0;}
          body[data-effective-display-mode="phone"] .kana-focus-card:last-child{grid-column:1 / -1;border-top:1px solid var(--ma-border);padding-inline:0;}
          body[data-effective-display-mode="phone"] .kana-record-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
          body[data-effective-display-mode="phone"] .kana-record-card,
          body[data-effective-display-mode="phone"] .kana-record-card:nth-child(2n),
          body[data-effective-display-mode="phone"] .kana-record-card:nth-last-child(-n+2){min-height:104px;padding:14px;border-right:1px solid var(--ma-border);border-bottom:1px solid var(--ma-border);}
          body[data-effective-display-mode="phone"] .kana-record-card:nth-child(2n){border-right:0;}
          body[data-effective-display-mode="phone"] .kana-record-card:nth-last-child(-n+2){border-bottom:0;}
          body[data-effective-display-mode="phone"] .kana-record-card.total{grid-column:1 / -1;min-height:0;border-right:0;border-top:1px solid var(--ma-border);}

          @media(max-width:900px){
            body[data-effective-display-mode="tablet"] .kana-hub-hero{grid-template-columns:1fr;gap:26px;padding-top:42px;}
            body[data-effective-display-mode="tablet"] .kana-hero-main h1{max-width:10.5ch;}
            body[data-effective-display-mode="tablet"] .kana-hero-visual{min-height:235px;max-width:600px;width:100%;margin-inline:auto;}
          }
          '''
          if block not in s:
            assert marker in s
            s=s.replace(marker,block+'\n'+marker)
          p.write_text(s)

          # Trainer: remove duplicate display-mode geometry and keep one shared
          # workspace owner for card/panel placement.
          p=root/'assets/css/mode-atlas-study-shared.css'
          s=p.read_text()
          start=s.index('/* === Source-level display mode layout for trainer pages === */')
          end=s.index('/* Mode-specific static states previously stored as inline styles. */', start)
          controls='''/* Display-mode trainer control sizing. Structural card/panel geometry is owned
             once by the responsive trainer workspace section below. */
          body[data-effective-display-mode="tablet"] .hiragana,
          body[data-effective-display-mode="tablet"] .prompt{font-size:clamp(6.6rem,15vw,8.2rem);}
          body[data-effective-display-mode="tablet"] .hiragana-wrap,
          body[data-effective-display-mode="tablet"] .prompt-wrap{min-height:148px;}
          body[data-effective-display-mode="tablet"] .scoreline{grid-template-columns:repeat(2,minmax(0,max-content));gap:9px;}
          body[data-effective-display-mode="tablet"] .score-pill,
          body[data-effective-display-mode="tablet"] .score-pill:nth-child(2),
          body[data-effective-display-mode="tablet"] #endlessWrongPill,
          body[data-effective-display-mode="tablet"] #dailyProgressPill,
          body[data-effective-display-mode="tablet"] #testQuestionPill{min-width:0;width:auto;}
          body[data-effective-display-mode="tablet"] .panel-content{max-height:320px;}
          body[data-effective-display-mode="tablet"] .bottom-shell .drawer-content{max-height:min(54vh,520px);}
          body[data-effective-display-mode="tablet"] .button-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
          body[data-effective-display-mode="tablet"] .rows-grid{grid-template-columns:repeat(5,minmax(0,1fr));}
          body[data-effective-display-mode="tablet"] .toggle-btn,
          body[data-effective-display-mode="tablet"] .btn{min-height:46px;font-size:.98rem;}

          body[data-effective-display-mode="phone"] .main h1{font-size:clamp(1.85rem,8.6vw,2.55rem);}
          body[data-effective-display-mode="phone"] .scoreline{grid-template-columns:repeat(2,minmax(0,1fr));}
          body[data-effective-display-mode="phone"] .score-pill,
          body[data-effective-display-mode="phone"] .score-pill:nth-child(2),
          body[data-effective-display-mode="phone"] #endlessWrongPill,
          body[data-effective-display-mode="phone"] #dailyProgressPill,
          body[data-effective-display-mode="phone"] #testQuestionPill{min-width:0;width:100%;padding:8px 10px;font-size:.9rem;}
          body[data-effective-display-mode="phone"] .hiragana-wrap,
          body[data-effective-display-mode="phone"] .prompt-wrap{min-height:112px;}
          body[data-effective-display-mode="phone"] .hiragana,
          body[data-effective-display-mode="phone"] .prompt{font-size:clamp(4.8rem,27vw,6.8rem);}
          body[data-effective-display-mode="phone"] input[type="text"]{width:min(100%,320px);font-size:20px;}
          body[data-effective-display-mode="phone"] .panel-content{max-height:260px;}
          body[data-effective-display-mode="phone"] .choice-grid,
          body[data-effective-display-mode="phone"] .button-grid,
          body[data-effective-display-mode="phone"] .rows-grid{width:100%;gap:8px;}
          body[data-effective-display-mode="phone"] .button-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
          body[data-effective-display-mode="phone"] .rows-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
          body[data-effective-display-mode="phone"] .choice-btn{min-height:56px;font-size:28px;border-radius:12px;}
          body[data-effective-display-mode="phone"] .bottom-shell{z-index:75;}
          body[data-effective-display-mode="phone"] .drawer-content{max-height:min(62vh,460px);padding:12px;}

          '''
          s=s[:start]+controls+s[end:]
          start=s.index('/* Responsive trainer ownership. These selectors deliberately target the new')
          end=s.index('/* === 2.31 focused trainer workspace === */', start)
          workspace='''/* Responsive trainer workspace. One shared owner controls card, side-panel,
             and page geometry for the effective display mode. */
          @media (max-width:1180px) and (min-width:761px){
            body.ma-reading-page,
            body.ma-writing-page{--ma-trainer-side-top:104px;}
            .ma-trainer-card{width:min(760px,calc(100vw - 32px));}
          }
          @media (max-width:760px){
            .ma-pause-overlay{display:none!important;}
            .session-actions .ma-button{min-width:130px;padding-inline:14px;}
            body.ma-reading-page,
            body.ma-writing-page{display:block;padding:max(6px,env(safe-area-inset-top,0px)) 6px max(14px,env(safe-area-inset-bottom,0px));min-height:100svh;overflow-x:hidden;}
            .ma-trainer-shell{display:block;min-height:auto;}
            .ma-trainer-card{width:100%;max-width:none;box-sizing:border-box;margin:0 auto 86px;border-radius:22px;padding:18px 10px 22px;min-height:auto;}
            .ma-trainer-score{padding:8px 11px;font-size:.95rem;}
            .ma-trainer-input{width:min(100%,320px);font-size:20px;padding:10px 12px;}
            .ma-trainer-input--number{width:120px;font-size:18px;}
            .ma-trainer-side-panel{position:static;width:100%;max-height:none;margin:8px auto;}
            body.study-nav-hidden .ma-trainer-side-panel{position:static;max-height:none;}
            .ma-reading-page .bottom-shell,
            .ma-writing-page .bottom-shell{width:100%;max-width:100%;overflow-x:hidden;}
          }
          body[data-effective-display-mode="tablet"].ma-reading-page,
          body[data-effective-display-mode="tablet"].ma-writing-page{display:block;padding:max(8px,env(safe-area-inset-top,0px)) 8px max(18px,env(safe-area-inset-bottom,0px));min-height:100dvh;overflow-x:hidden;}
          body[data-effective-display-mode="tablet"] .ma-trainer-shell{display:block;width:100%;min-height:auto;margin-inline:auto;}
          body[data-effective-display-mode="tablet"] .ma-trainer-card{width:min(760px,calc(100vw - 32px));max-width:none;box-sizing:border-box;margin:0 auto 94px;padding:22px 28px 58px;}
          body[data-effective-display-mode="tablet"] .ma-trainer-side-panel,
          html[data-effective-display-mode="tablet"] body .ma-trainer-side-panel{position:static;width:min(760px,calc(100vw - 32px));max-height:none;margin:10px auto;}
          body[data-effective-display-mode="tablet"].study-nav-hidden .ma-trainer-side-panel{position:static;max-height:none;}

          body[data-effective-display-mode="phone"].ma-reading-page,
          body[data-effective-display-mode="phone"].ma-writing-page{display:block;padding:max(6px,env(safe-area-inset-top,0px)) 6px max(14px,env(safe-area-inset-bottom,0px));min-height:100dvh;overflow-x:hidden;}
          body[data-effective-display-mode="phone"] .ma-trainer-shell{display:block;min-height:auto;}
          body[data-effective-display-mode="phone"] .ma-trainer-card{width:100%;max-width:none;box-sizing:border-box;margin:0 auto 86px;padding:18px 10px 22px;border-radius:22px;}
          body[data-effective-display-mode="phone"]:not(.trainer-session-active) .ma-trainer-prompt-wrap{min-height:96px;margin-bottom:4px;}
          body[data-effective-display-mode="phone"] .ma-trainer-input{width:min(100%,320px);font-size:20px;padding:10px 12px;}
          body[data-effective-display-mode="phone"] .ma-trainer-side-panel,
          html[data-effective-display-mode="phone"] body .ma-trainer-side-panel{position:static;width:100%;max-height:none;margin:8px auto;}
          body[data-effective-display-mode="phone"].study-nav-hidden .ma-trainer-side-panel{position:static;max-height:none;}

          @media(min-width:980px){
            body[data-effective-display-mode="tablet"]:not(.trainer-session-active) .ma-trainer-shell{width:min(1080px,calc(100vw - 32px));display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,300px);grid-template-rows:auto auto;gap:14px 18px;align-items:start;margin:0 auto 94px;}
            body[data-effective-display-mode="tablet"]:not(.trainer-session-active) .ma-trainer-card{grid-column:1;grid-row:1 / span 2;width:100%;margin:0;}
            body[data-effective-display-mode="tablet"]:not(.trainer-session-active) .ma-trainer-side-panel,
            html[data-effective-display-mode="tablet"] body:not(.trainer-session-active) .ma-trainer-side-panel{width:100%;margin:0;}
            body[data-effective-display-mode="tablet"]:not(.trainer-session-active) .left-panel{grid-column:2;grid-row:1;}
            body[data-effective-display-mode="tablet"]:not(.trainer-session-active) .right-panel{grid-column:2;grid-row:2;}
          }

          '''
          s=s[:start]+workspace+s[end:]
          s=s.replace('min-height:calc(100svh - 150px);','min-height:calc(100svh - 138px);')
          s=s.replace('body[data-effective-display-mode="tablet"].trainer-session-active .ma-trainer-card{\n  width:min(760px,calc(100vw - 28px));','body[data-effective-display-mode="tablet"].trainer-session-active .ma-trainer-card{\n  width:min(820px,calc(100vw - 32px));')
          p.write_text(s)

          # Profile/Settings: give Tablet a useful side-sheet width and let Phone
          # use the screen instead of keeping desktop gutters around a full-screen UI.
          p=root/'assets/css/mode-atlas-profile-settings.css'
          s=p.read_text()
          s=s.replace('width:min(620px,calc(100vw - 32px));\n  max-width:calc(100vw - 32px);','width:min(680px,calc(100vw - 28px));\n  max-width:calc(100vw - 28px);')
          s=s.replace('top:calc(env(safe-area-inset-top,0px) + 12px);\n  right:10px;\n  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);\n  left:10px;','top:calc(env(safe-area-inset-top,0px) + 8px);\n  right:6px;\n  bottom:calc(env(safe-area-inset-bottom,0px) + 8px);\n  left:6px;')
          p.write_text(s)

          # Regression contract: explicit mode page ownership + real tablet workspace.
          p=root/'tests/frontend.test.js'
          s=p.read_text()
          s=s.replace('body\\[data-effective-display-mode="phone"\\] \\.ma-trainer-card\\{[\\s\\S]*?padding:18px 12px 28px;', 'body\\[data-effective-display-mode="phone"\\] \\.ma-trainer-card\\{[\\s\\S]*?padding:18px 10px 22px;')
          test_start=s.index("test('2.47 final responsive polish")
          needle="  const study = read('assets/css/mode-atlas-study-shared.css');\n"
          pos=s.index(needle,test_start)+len(needle)
          s=s[:pos]+"  const home = read('assets/css/mode-atlas-home-page.css');\n  const kana = read('assets/css/mode-atlas-kana-page.css');\n"+s[pos:]
          needle='  assert.match(navigation, /body\\[data-effective-display-mode="phone"\\] \\.ma-nav__actions\\{[\\s\\S]*grid-row:1/);\n'
          pos=s.index(needle,test_start)+len(needle)
          extra='''  assert.match(navigation, /body\\[data-effective-display-mode="tablet"\\] \\.ma-nav\\{[\\s\\S]*display:flex/,
            'explicit Tablet navigation must stay a compact single-row composition');

          assert.match(home, /body\\[data-effective-display-mode="tablet"\\] \\.atlas-hero__stage/,
            'Atlas home must consume explicit Tablet mode directly');
          assert.match(home, /body\\[data-effective-display-mode="phone"\\] \\.atlas-hero/,
            'Atlas home must consume explicit Phone mode directly');
          assert.match(kana, /body\\[data-effective-display-mode="tablet"\\] \\.kana-hub-hero/,
            'Kana hub must consume explicit Tablet mode directly');
          assert.match(kana, /body\\[data-effective-display-mode="phone"\\] \\.kana-mastery-grid/,
            'Kana Phone mode must own compact progress density');
          '''
          s=s[:pos]+extra+s[pos:]
          needle="  assert.match(study, /body\\.trainer-session-active \\.ma-trainer-prompt-wrap/,\n    'focused active-session sizing must remain owned separately');\n"
          pos=s.index(needle,test_start)+len(needle)
          extra='''  assert.match(study, /body\\[data-effective-display-mode="phone"\\]:not\\(\\.trainer-session-active\\) \\.ma-trainer-prompt-wrap\\{min-height:96px/,
            'idle Phone trainer must not reserve active-session prompt height');
          assert.match(study, /@media\\(min-width:980px\\)[\\s\\S]*data-effective-display-mode="tablet"[\\s\\S]*grid-template-columns:minmax\\(0,1fr\\) minmax\\(260px,300px\\)/,
            'wide Tablet trainer must use the available workspace instead of a narrow centred desktop card');
          '''
          s=s[:pos]+extra+s[pos:]
          p.write_text(s)
          PY
      - name: Build and validate
        run: |
          python3 build_revision_assets.py
          python3 audit_project.py
          node --test tests/backend.test.js tests/frontend.test.js
          git diff --check
      - name: Commit responsive source rewrite
        shell: bash
        run: |
          git config user.name 'Mode Atlas Release Bot'
          git config user.email '48079170+ModeAtlas@users.noreply.github.com'
          git add assets/css tests/frontend.test.js
          if git diff --cached --quiet; then
            echo 'No responsive source changes produced.' >&2
            exit 1
          fi
          git commit -m 'Rework phone and tablet layouts'
          git push origin HEAD:agent/mode-atlas-2.47.0-release-candidate-hardening
