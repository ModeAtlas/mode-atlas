<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="0; url=/writing/" />
  <link rel="canonical" href="https://mode-atlas.app/writing/" />
  <title>Redirecting • Mode Atlas</title>
  <script>
    (function() {
      var target = new URL('/writing/', location.origin);
      var source = new URLSearchParams(location.search);
      source.forEach(function(value, key) { if (key !== 'build' && key !== 'v' && key !== 'reload') target.searchParams.set(key, value); });
      target.hash = location.hash;
      location.replace(target.href);
    })();
  </script>
</head>
<body>
  <p>Redirecting to <a href="/writing/">/writing/</a>…</p>
</body>
</html>
